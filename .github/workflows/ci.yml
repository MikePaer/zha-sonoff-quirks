name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Verifica integrita' della quirk
        run: sha256sum -c checksums.sha256

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # Programmi on-device: servizi, store e run log contro Home Assistant vero.
  # pytest-homeassistant-custom-component 0.13.373 = HA 2026.10.2, con le
  # versioni di zigpy/zha-quirks che quella release usa.
  test-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: >-
          uv pip install --system
          "pytest-homeassistant-custom-component==0.13.373"
          "zigpy==2.3.0" "zha-quirks==2.3.0"

      - name: Test (Home Assistant)
        run: pytest -q tests_ha -o asyncio_mode=auto
