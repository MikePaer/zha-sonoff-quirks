set_program:
  fields:
    start_time:
      required: false
      example: "05:00"
      selector:
        time:
    start_entity:
      required: false
      example: input_datetime.irrigation_start
      selector:
        entity:
          filter:
            - domain: [input_datetime]
    gap_minutes:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
          mode: box
    slot:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 5
          mode: box
    zones:
      required: true
      example: >-
        [{"switch": "switch.front_lawn", "minutes_entity":
        "input_number.front_lawn_minutes", "enabled_entity":
        "input_boolean.front_lawn_enabled"}]
      selector:
        object:

clear_program:
